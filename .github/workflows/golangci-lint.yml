name: golangci-lint

on:
  push:
    branches:
      - mc
  pull_request:
    branches:
      - mc

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: latest
          args: --fix=false
